<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAWAND — Solar System</title>
<meta name="description" content="A luxurious interactive 3D solar system in the Milky Way. By Lawand." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cairo:wght@300;400;700&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f4d97c;
    --bg: #02030a;
    --text-dim: rgba(255, 255, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', 'Cairo', sans-serif; color: #fff; }

  #scene { position: fixed; inset: 0; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  .loader-mark {
    font-family: 'Cinzel', serif; font-weight: 900; font-size: 58px; letter-spacing: 4px;
    background: linear-gradient(135deg, #8a6d1f, var(--gold) 40%, #fff7d6 50%, var(--gold) 60%, #8a6d1f);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 2.2s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .loader-bar { width: 220px; height: 1px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
  .loader-bar::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: sweep 1.4s ease-in-out infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }

  /* ---------- Overlay UI ---------- */
  .ui { position: fixed; z-index: 10; pointer-events: none; }
  .ui a, .ui .btn { pointer-events: auto; }

  header.ui {
    top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 42px;
    animation: fadeDown 1.4s .4s ease both;
  }
  .logo { font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; letter-spacing: 6px; color: var(--gold); text-decoration: none; }
  nav { display: flex; gap: 34px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; transition: color .3s; }
  nav a:hover { color: var(--gold-light); }

  .hero-sub {
    left: 0; right: 0; bottom: 12vh;
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    animation: fadeUp 1.6s 1s ease both;
  }
  .hero-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(26px, 4vw, 46px); letter-spacing: 8px; color: #fff; text-shadow: 0 0 40px rgba(212,175,55,.35); }
  .hero-line { display: flex; align-items: center; gap: 16px; color: var(--text-dim); font-weight: 200; font-size: 13px; letter-spacing: 6px; text-transform: uppercase; }
  .hero-line::before, .hero-line::after { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .hero-line::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .hero-ar { font-family: 'Cairo', sans-serif; font-weight: 300; font-size: 15px; color: rgba(244, 217, 124, 0.75); }

  /* planet info chip */
  #planet-label {
    position: fixed; z-index: 11; pointer-events: none;
    padding: 7px 16px; border: 1px solid rgba(212,175,55,.4);
    background: rgba(5,6,15,.7); backdrop-filter: blur(8px);
    font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 3px; color: var(--gold-light);
    transform: translate(-50%, -150%); opacity: 0; transition: opacity .25s;
    white-space: nowrap;
  }

  footer.ui {
    bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 42px;
    font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,.3); text-transform: uppercase;
    animation: fadeUp 1.6s 1.4s ease both;
  }
  .hint { display: flex; align-items: center; gap: 10px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .2; transform: scale(.7); } }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  .vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }

  #fallback { position: fixed; inset: 0; z-index: 4; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-family: 'Cinzel', serif; font-size: clamp(20px, 5vw, 40px); color: var(--gold-light); }

  @media (max-width: 640px) {
    header.ui { padding: 20px 22px; } nav { display: none; }
    .hero-sub { bottom: 9vh; padding: 0 16px; } footer.ui { padding: 16px 20px; font-size: 9px; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-mark">LAWAND</div>
  <div class="loader-bar"></div>
</div>

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div id="planet-label"></div>
<div id="fallback">Your browser does not support 3D (WebGL).<br>المتصفح لا يدعم العرض ثلاثي الأبعاد.</div>

<header class="ui">
  <a class="logo" href="#">LAWAND</a>
  <nav>
    <a href="https://github.com/Lawand-7" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/Lawand-7?tab=repositories" target="_blank" rel="noopener">Projects</a>
    <a href="https://github.com/Lawand-7" target="_blank" rel="noopener">Contact</a>
  </nav>
</header>

<div class="ui hero-sub">
  <div class="hero-title">THE SOLAR SYSTEM</div>
  <div class="hero-line">Drag to orbit · Scroll to zoom · Hover a planet</div>
  <div class="hero-ar">رحلة عبر المجموعة الشمسية في درب التبانة</div>
</div>

<footer class="ui">
  <span>© 2026 Lawand — Crafted among the stars</span>
  <span class="hint"><span class="dot"></span> Interactive 3D</span>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');
const labelEl = document.getElementById('planet-label');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  loaderEl.classList.add('done');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(0, 70, 165);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 30;
controls.maxDistance = 600;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.target.set(0, 0, 0);

// ---------- Texture helpers (procedural canvas textures — no external files) ----------
function makePlanetTexture(c1, c2, c3, bands) {
  const s = 512;
  const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c3);
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  // soft horizontal bands / blotches for surface detail
  for (let i = 0; i < (bands || 60); i++) {
    x.globalAlpha = Math.random() * 0.12 + 0.03;
    x.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
    const y = Math.random() * s, h = Math.random() * 18 + 2;
    x.fillRect(0, y, s, h);
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------- Starfield (the Milky Way) ----------
function starLayer(count, spread, size, color, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    // spherical shell distribution for a galaxy-dome feel
    const r = spread * (0.6 + Math.random() * 0.4);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph) * 0.55; // flatten vertically -> disk
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color, size, sizeAttenuation: true, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending });
  return new THREE.Points(g, m);
}
const stars1 = starLayer(6000, 1600, 1.4, 0xffffff, 0.9);
const stars2 = starLayer(3000, 1200, 2.2, 0xbcd0ff, 0.7);
const stars3 = starLayer(2000, 1400, 2.6, 0xffe6b0, 0.6);
scene.add(stars1, stars2, stars3);

// Milky-way band: a faint tilted ring of dense stars
const band = starLayer(9000, 900, 1.2, 0xaab4ff, 0.45);
band.scale.set(1, 0.12, 1);
band.rotation.z = 0.5;
scene.add(band);

// ---------- The Sun ----------
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcf57 });
const sun = new THREE.Mesh(new THREE.SphereGeometry(10, 64, 64), sunMat);
scene.add(sun);
// glow sprite
const glowTex = (() => {
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,220,130,1)'); g.addColorStop(0.25, 'rgba(255,180,60,0.6)');
  g.addColorStop(0.5, 'rgba(255,140,30,0.2)'); g.addColorStop(1, 'rgba(255,120,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
glow.scale.set(60, 60, 1);
sun.add(glow);

const sunLight = new THREE.PointLight(0xfff0c0, 4, 0, 0.6);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223044, 0.6));

// ---------- Planets ----------
// [name, radius, distance, color1, color2, color3, orbitSpeed, spin, ring?]
const defs = [
  ['Mercury', 1.4,  18, '#9c8a7a', '#6b5d50', '#4a3f36', 1.6, 0.01],
  ['Venus',   2.4,  26, '#e6c894', '#c9a25a', '#8a6d34', 1.18, 0.008],
  ['Earth',   2.6,  36, '#3a7bd5', '#2e8b57', '#1f4e8c', 1.0, 0.02, false, 'moon'],
  ['Mars',    2.0,  47, '#d96b3a', '#a14228', '#6e2c18', 0.81, 0.018],
  ['Jupiter', 6.2,  68, '#d8b48a', '#b07d4f', '#7c5230', 0.44, 0.04],
  ['Saturn',  5.4,  92, '#e7d39a', '#c2a35e', '#8c7438', 0.32, 0.038, true],
  ['Uranus',  3.6,  114,'#9fe3e3', '#6fc2c9', '#3f8a93', 0.23, 0.03],
  ['Neptune', 3.5,  134,'#3f63c9', '#2c47a0', '#1a2c66', 0.18, 0.03],
];

const planets = [];
const pickGroup = new THREE.Group();
scene.add(pickGroup);

defs.forEach((d) => {
  const [name, radius, dist, c1, c2, c3, speed, spin, ring, moon] = d;
  const orbit = new THREE.Group();
  scene.add(orbit);

  const tex = makePlanetTexture(c1, c2, c3, 70);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.1 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
  mesh.position.x = dist;
  mesh.userData = { name };
  orbit.add(mesh);
  pickGroup.add(mesh);

  // Saturn-style ring
  if (ring) {
    const rGeo = new THREE.RingGeometry(radius * 1.4, radius * 2.4, 80);
    const rMat = new THREE.MeshBasicMaterial({ color: 0xd9c89a, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
    const rMesh = new THREE.Mesh(rGeo, rMat);
    rMesh.rotation.x = Math.PI / 2.2;
    mesh.add(rMesh);
  }

  // Earth's moon
  let moonObj = null;
  if (moon) {
    moonObj = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 1 })
    );
    mesh.add(moonObj);
  }

  // orbit path line
  const pts = [];
  for (let i = 0; i <= 128; i++) { const a = (i / 128) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist)); }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.12 })
  );
  scene.add(line);

  orbit.rotation.y = Math.random() * Math.PI * 2;
  planets.push({ orbit, mesh, speed, spin, dist, moonObj, name });
});

// ---------- Postprocessing: bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Hover picking ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hovered = null;
addEventListener('pointermove', (e) => {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  labelEl.style.left = e.clientX + 'px';
  labelEl.style.top = e.clientY + 'px';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

loaderEl.classList.add('done');

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  sun.rotation.y += dt * 0.15;
  glow.material.rotation += dt * 0.05;
  glow.scale.setScalar(60 + Math.sin(t * 1.5) * 2.5);

  planets.forEach((p) => {
    p.orbit.rotation.y += dt * 0.12 * p.speed;
    p.mesh.rotation.y += p.spin;
    if (p.moonObj) {
      p.moonObj.position.set(Math.cos(t * 1.5) * 4.5, 0, Math.sin(t * 1.5) * 4.5);
    }
  });

  stars1.rotation.y += dt * 0.005;
  stars2.rotation.y -= dt * 0.003;
  band.rotation.y += dt * 0.004;

  // hover detection
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickGroup.children, false);
  const hit = hits.length ? hits[0].object : null;
  if (hit !== hovered) {
    hovered = hit;
    if (hovered) { labelEl.textContent = hovered.userData.name; labelEl.style.opacity = '1'; }
    else { labelEl.style.opacity = '0'; }
  }

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
